# Insert inside the existing tiendavirtualsuper.com server block.
# Keep storefront, ERP, WhatsApp and n8n on their existing upstreams.
# BC request planning uses the same configuration with corrected business detection.
location = /admin/mensajes/simulador {
  proxy_pass http://127.0.0.1:4008;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_read_timeout 180;
}
location = /api/admin/conversations/simulate {
  proxy_pass http://127.0.0.1:4008;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 180;
}
location = /api/admin/rocky {
  proxy_pass http://127.0.0.1:4008;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 180;
}
location ^~ /api/internal/rocky/ {
  proxy_pass http://127.0.0.1:4008;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 180;
}
location @rocky_static {
  # Keep immutable assets from both releases here before switching simulator traffic.
  root /home/IMPORTADORA-releases/rocky-20260921-r2;
  rewrite ^/_next/static/(.*)$ /.next/static/$1 break;
  try_files $uri =404;
  expires 365d;
  add_header Cache-Control "public, max-age=31536000, immutable";
}
# Existing /_next/static/ location should use ^~ and additionally:
# proxy_intercept_errors on;
# error_page 404 = @rocky_static;

location = /api/internal/chat/requests {
  proxy_pass http://127.0.0.1:4005;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 180;
}

# Catalog image audit: admin page and authenticated report exports.
location = /admin/atencion {
  proxy_pass http://127.0.0.1:4006;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_read_timeout 180;
}
location = /api/admin/catalog-image-audit {
  proxy_pass http://127.0.0.1:4005;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 180;
}
