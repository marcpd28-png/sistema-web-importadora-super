# Insert inside the existing tiendavirtualsuper.com server block.
# Keep storefront, ERP, WhatsApp and n8n on their existing upstreams.
# BC request planning uses the same configuration with corrected business detection.
location = /admin/mensajes/simulador {
  proxy_pass http://127.0.0.1:4002;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_read_timeout 180;
}
location = /api/admin/conversations/simulate {
  proxy_pass http://127.0.0.1:4002;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 180;
}
location = /api/admin/rocky {
  proxy_pass http://127.0.0.1:4002;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 180;
}
location ^~ /api/internal/rocky/ {
  proxy_pass http://127.0.0.1:4002;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 180;
}
location @rocky_static {
  proxy_pass http://127.0.0.1:4002;
  expires 365d;
  add_header Cache-Control "public, max-age=31536000, immutable";
}
# Existing /_next/static/ location should use ^~ and additionally:
# proxy_intercept_errors on;
# error_page 404 = @rocky_static;

location = /api/internal/chat/requests {
  proxy_pass http://127.0.0.1:4002;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 180;
}
